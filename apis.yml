aid: glorri-inc
name: GLORRI, INC.
description: >-
  Glorri is a cloud-based applicant tracking system (ATS) and recruitment
  automation platform for talent acquisition teams. It spans the entire hiring
  process, from sourcing candidates across multiple channels and job boards, to
  automating recruiting workflows and candidate communication, AI-assisted
  applicant screening, and analytics on team performance and hiring efficiency,
  with GDPR-compliant data handling. Glorri markets plans (Pay as you go, Flex,
  Corporate, and Enterprise Plus) for companies of different sizes, with custom
  integrations and a branded career page available on higher tiers. The company
  was surfaced as a portfolio company of 500 Global and added to the API
  Evangelist network; as of this enrichment pass Glorri publishes a web
  application and marketing site but no public developer portal, API
  documentation, or machine-readable API specification.
